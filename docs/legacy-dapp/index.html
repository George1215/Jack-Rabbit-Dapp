<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jack Rabbit Dapp</title>
  <link rel="stylesheet" href="dapp.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
</head>
<body>
  <header class="dapp-header">
    <img src="../assets/jacklogo.png" alt="Jack Rabbit Logo" class="header-logo" />
    <nav class="header-nav">
          <!-- Carrot tab -->
        <img
        src="../assets/carrot.png"
        alt="Diamond Hands"
        id="carrot-tab"
        class="nav-tab active"
      />
      <!-- Paw tab -->
      <img
        src="../assets/paw.png"
        alt="Jackies"
        id="paw-tab"
        class="nav-tab"
      />
      <button id="connect-btn"  class="nav-btn">Connect wallet</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Diamond Hands!!!</h1>
      <p>Stake your favourite tokens to earn Jack in the pools below</p>
    </section>

<!-- Pools Section -->
<section class="pools">
    <!-- LEFT SIDE: Stake / Unstake + Pools Table -->
    <div class="pools-left-wrapper">
      <!-- Tabs sit on the orange background -->
      <div class="panel-tabs left-tabs">
        <button class="tab stake">Stake</button>
        <button class="tab unstake">Unstake</button>
      </div>
      <!-- White skewed panel containing the data table -->
      <div class="panel left-panel">
        <table class="data-table">
          <thead>
            <tr>
              <th>Token</th>
              <th>Symbol</th>
              <th>APY</th>
              <th>Total Staked</th>
                    <!-- new header for badge -->
              <th></th>
              <th>Your Stake</th>
            </tr>
          </thead>
          <tbody id="pools-body">
            
          </tbody>
        </table>
      </div>
      </div>
    </div>
  
    <!-- RIGHT SIDE: Rewards Panel -->
    <div class="pools-right-wrapper">
      <!-- Rewards tab on the orange background -->
      <div class="panel-tabs right-tabs">
        <button class="tab rewards">Rewards</button>
      </div>
      <!-- White skewed panel containing the rewards rows -->
      <div class="panel right-panel">
        <table class="rewards-table">
            <thead>
                <!-- spacer row to push real rows down -->
                <tr class="spacer-row">
                 
                  <td>Jack tokens</td>
                </tr>
              </thead>
          <tbody>
            <tr>
              <td>3,346</td>
              <td><button class="claim-btn">Claim</button></td>
            </tr>
            <tr>
              <td>3,346</td>
              <td><button class="claim-btn">Claim</button></td>
            </tr>
            <tr>
              <td>3,346</td>
              <td><button class="claim-btn">Claim</button></td>
            </tr>
            <tr>
              <td>3,346</td>
              <td><button class="claim-btn">Claim</button></td>
            </tr>
            <tr>
              <td>3,346</td>
              <td><button class="claim-btn">Claim</button></td>
            </tr>
            <tr>
              <td>3,346</td>
              <td><button class="claim-btn">Claim</button></td>
            </tr>
            <tr>
              <td>3,346</td>
              <td><button class="claim-btn">Claim</button></td>
            </tr>
            <tr>
              <td>3,346</td>
              <td><button class="claim-btn">Claim</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
<!-- ─── STAKE / UNSTAKE MODAL ─────────────────────────────── -->
<div id="action-modal" class="modal hidden">
  <div class="modal-overlay"></div>
  <div class="modal-input-field">
    <!-- skewed header -->
  <h2 class="modal-title">Stake!!!</h2>
  <div class="modal-panel panel">
    <!-- Close button -->
    <button class="modal-close">&times;</button>
    <!-- Skewed title -->
    
    <!-- BODY -->
    <div class="modal-body">
      <!-- INPUT ROW (fixed white bar) -->
      <div class="modal-input-row">
        <!-- Token pill -->
        <div class="token-field">
          <img id="modal-token-icon"
               class="token-field__icon"
               src="../assets/pls.svg"
               alt="Token icon" />
          <span id="modal-token-symbol">PLS</span>
          <span class="token-field__arrow">▾</span>
        </div>

        <!-- Number input (shown by default) -->
        <input id="modal-amount"
               class="modal-input"
               type="number"
               placeholder="0.0" />

        <!-- Search input (hidden until token pill click) -->
        <input id="modal-search"
               class="modal-search-input hidden"
               type="text"
               placeholder="Type a currency or ticker"
               autocomplete="off" />

        <!-- Dropdown list (hidden until search mode) -->
        <div id="modal-search-list"
             class="modal-search-list hidden">
        </div>
      </div>

      <!-- Balance & Confirm -->
      <div class="modal-footer">
        <span class="modal-balance">
          Balance: <strong id="modal-balance">0</strong>
        </span>
        <button id="modal-action-btn" class="claim-btn">
          Confirm Stake
        </button>
      </div>
    </div>
  </div>
</div>
</div>


  </main>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script type="module" src="dapp.js"></script>
</body>
</html>
